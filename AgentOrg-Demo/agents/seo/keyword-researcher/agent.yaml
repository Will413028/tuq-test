agent: keyword-researcher
title: "Keyword Researcher"
display_name: "關鍵字研究員"
team: seo
type: worker
reports_to: seo/manager

bootstrap:
  - soul.md
  - org.md
  - tools.md

workflow: workflow.yaml

dispatch:
  model: sonnet
  trigger: "關鍵字探勘、搜尋意圖分類、競品關鍵字缺口分析、長尾關鍵字挖掘、關鍵字難度評估，輸出結構化關鍵字清單供 Content Strategist 使用"
  not_for: "內容策略與大綱規劃（Content Strategist）、技術 SEO 稽核（Technical Auditor）、流量/排名數據報告（Analytics Reporter）、agent 系統修改"
